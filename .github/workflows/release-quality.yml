name: Release quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full-stack verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: make setup

      - name: Run all non-browser release gates
        run: make verify

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run isolated desktop and mobile workflows
        run: make test-browser

      - name: Recheck the release package
        run: .venv/bin/python scripts/release_audit.py --allow-pending-manifest

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightingale-release-evidence
          path: |
            output/evidence
            output/pdf/nightingale_continuum_technical_brief.pdf
          if-no-files-found: error
          retention-days: 14
